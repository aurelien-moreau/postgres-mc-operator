# Namespaced Role installed on EACH workload cluster.
# Scoped to the postgres namespace — the operator only manages resources there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-mc-operator-workload
  namespace: postgres
rules:
  # Zalando postgresql CRD
  - apiGroups: [acid.zalan.do]
    resources: [postgresqls, postgresqls/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # Credential secret sync — no delete (operator never removes secrets)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
  # Cross-cluster alias Services and Endpoints
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [get, list, watch, create, update, patch, delete]
  # Patroni config patching (optional, only needed for advanced failover)
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, patch]
