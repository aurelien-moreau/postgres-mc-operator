# Namespaced Role for the operator on the tech cluster.
# Scoped to postgres-system only — the operator has no reason to read
# Secrets or resources outside its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-mc-operator-role
  namespace: postgres-system
rules:
  # PostgresMC CRD management (namespaced resource)
  - apiGroups: [pgmc.aurelops.com]
    resources: [postgresmcs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [pgmc.aurelops.com]
    resources: [postgresmcs/status]
    verbs: [get, update, patch]
  - apiGroups: [pgmc.aurelops.com]
    resources: [postgresmcs/finalizers]
    verbs: [update]
  # Read kubeconfig Secrets for workload clusters (postgres-system namespace only)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # Emit events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
