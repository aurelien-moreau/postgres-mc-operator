---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: postgresmcs.pgmc.aurelops.com
spec:
  group: pgmc.aurelops.com
  names:
    kind: PostgresMC
    listKind: PostgresMCList
    plural: postgresmcs
    shortNames:
    - pgmc
    singular: postgresmc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentPrimary
      name: Primary
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresMCSpec defines the desired state of PostgresMC.
            properties:
              autoFailover:
                description: |-
                  AutoFailover controls automatic promotion when the primary becomes unreachable.
                  Disabled by default to avoid split-brain on transient network failures.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled activates automatic failover. Default false.
                      When true, the operator promotes the first healthy standby after the primary
                      has been unreachable for PrimaryUnreachableThreshold consecutive reconciliations.
                    type: boolean
                  primaryUnreachableThreshold:
                    default: 3
                    description: |-
                      PrimaryUnreachableThreshold is the number of consecutive reconcile cycles during
                      which the primary must be unreachable before auto-failover is triggered.
                      Each cycle is ~30s, so the default of 3 means ~90s of downtime before promotion.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              clusters:
                description: Clusters is the list of workload-cluster targets. Exactly
                  one must have role=primary.
                items:
                  description: ClusterTarget describes one workload cluster the operator
                    should reconcile against.
                  properties:
                    clusterRef:
                      description: |-
                        ClusterRef is the name of the Secret on the technical cluster that holds the kubeconfig.
                        The Secret must have a key "kubeconfig".
                      minLength: 1
                      type: string
                    externalHost:
                      description: |-
                        ExternalHost overrides the cross-cluster DNS name used by standbys to reach this cluster.
                        If empty the operator uses the Zalando LoadBalancer Service hostname (primary only).
                      type: string
                    externalPort:
                      default: 5432
                      description: ExternalPort is the port standbys use to reach
                        this cluster.
                      format: int32
                      type: integer
                    name:
                      description: Name is a stable, user-defined identifier for this
                        target (e.g. "eu-west-1").
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: Namespace on the workload cluster where the Zalando
                        postgresql resource will be created.
                      minLength: 1
                      type: string
                    role:
                      description: Role defines whether this cluster is primary or
                        standby. Exactly one target MUST be primary.
                      enum:
                      - primary
                      - standby
                      type: string
                    secretNamespace:
                      description: |-
                        SecretNamespace is the namespace of the kubeconfig Secret on the technical cluster.
                        Defaults to the PostgresMC's own namespace.
                      type: string
                  required:
                  - clusterRef
                  - name
                  - namespace
                  - role
                  type: object
                maxItems: 8
                minItems: 1
                type: array
              postgresqlSpec:
                description: |-
                  PostgresqlSpec is merged into every target's Zalando postgresql.spec.
                  The operator injects the standby section automatically for non-primary targets.
                  Use RawExtension to stay forward-compatible with Zalando schema changes.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              replication:
                description: Replication tunables shared across all clusters.
                properties:
                  mode:
                    default: async
                    description: Mode is the streaming replication mode.
                    enum:
                    - async
                    - sync
                    type: string
                type: object
              replicationService:
                description: |-
                  ReplicationService configures the Service the operator creates on every cluster
                  to expose PostgreSQL for cross-cluster WAL streaming.
                  With this, externalHost on each ClusterTarget becomes optional — the operator
                  discovers the endpoint automatically from node IPs or the LoadBalancer status.
                properties:
                  nodePort:
                    default: 32432
                    description: |-
                      NodePort is the fixed port used when Type=NodePort.
                      The same port is used on every cluster, routable via each cluster's node IP.
                      Must be in the Kubernetes NodePort range (30000–32767).
                    format: int32
                    maximum: 32767
                    minimum: 30000
                    type: integer
                  type:
                    default: NodePort
                    description: |-
                      Type is the Kubernetes Service type.
                      NodePort is recommended for local/kind environments.
                      LoadBalancer is recommended for cloud environments.
                    enum:
                    - NodePort
                    - LoadBalancer
                    type: string
                required:
                - type
                type: object
              teamId:
                description: TeamID is propagated to every Zalando postgresql cluster.
                minLength: 1
                type: string
            required:
            - clusters
            - postgresqlSpec
            - teamId
            type: object
          status:
            description: PostgresMCStatus is the observed state of PostgresMC.
            properties:
              clusters:
                description: Clusters contains per-target reconciliation status.
                items:
                  description: ClusterStatus reports reconciliation state for a single
                    target cluster.
                  properties:
                    conditions:
                      description: Conditions are per-cluster detailed conditions.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    endpoint:
                      description: Endpoint is the primary service endpoint (populated
                        for the primary cluster).
                      type: string
                    lastSyncedAt:
                      description: LastSyncedAt is the timestamp of the last successful
                        reconcile for this cluster.
                      format: date-time
                      type: string
                    name:
                      description: Name matches ClusterTarget.Name.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the PostgresMC generation
                        last reconciled for this cluster.
                      format: int64
                      type: integer
                    phase:
                      description: Phase is a human-readable phase for this cluster.
                      type: string
                    role:
                      description: Role is the current role for this cluster (may
                        differ from spec during failover).
                      enum:
                      - primary
                      - standby
                      type: string
                  required:
                  - name
                  - role
                  type: object
                type: array
              conditions:
                description: Conditions are top-level conditions for the PostgresMC
                  as a whole.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentPrimary:
                description: CurrentPrimary is the Name of the ClusterTarget currently
                  acting as primary.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last fully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the rolled-up phase across all targets.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - FailingOver
                - Failed
                type: string
              primaryFailureCount:
                description: |-
                  PrimaryFailureCount is the number of consecutive reconciliations during which
                  the current primary was unreachable. Reset to 0 when the primary is reachable again.
                  Used by the auto-failover logic.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
